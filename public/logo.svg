<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 48 48" style="enable-background:new 0 0 48 48;" xml:space="preserve">
<defs>
  <linearGradient id="masar-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0D3B3E"/>
    <stop offset="100%" stop-color="#082A2C"/>
  </linearGradient>
  <linearGradient id="masar-mint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#A3D9A5"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <style type="text/css">
    .z-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>
</defs>

<!-- Rounded tile background -->
<rect width="48" height="48" rx="12" fill="url(#masar-tile)"/>

<!-- Dotted map pattern (decorative) -->
<g opacity="0.15" fill="white">
  <circle cx="8" cy="8" r="0.8"/>
  <circle cx="14" cy="8" r="0.8"/>
  <circle cx="20" cy="8" r="0.8"/>
  <circle cx="38" cy="40" r="0.8"/>
  <circle cx="40" cy="38" r="0.8"/>
  <circle cx="42" cy="36" r="0.8"/>
</g>

<!-- M drawn as a route path (left side, white) -->
<g class="z-breathe">
  <path d="M12 33V16L18 24L24 16V33"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>
  <!-- Route X mark (right side, mint gradient) -->
  <path d="M28 33V18L36 33V15"
    stroke="url(#masar-mint)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>
  <!-- Location pin dot -->
  <circle cx="36" cy="15" r="2" fill="#A3D9A5"/>
  <circle cx="36" cy="15" r="3.5" fill="#A3D9A5" opacity="0.25"/>
</g>
</svg>
